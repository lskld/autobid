spring:
  application:
    name: autobid-api
  datasource:
    url: jdbc:h2:mem:autobid;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000